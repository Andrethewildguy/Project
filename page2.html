<section>
<style>
    .card {
  box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
  transition: 0.3s;
  width: 20%;
    }
    .container {
  display: flex;
  justify-content: center;
  padding: 2px 16px;
    }
    body{
        background: whitesmoke;
        font-family:'Times New Roman', Times, serif;
        color: black;
        margin: 10;
    }
    header{
        text-align: center;
        padding: 5px;
        background: linear-gradient(90deg, #555555, white);
    }
    .flip-card {
  background-color: transparent;
  width: 500px;
  height: 500px;
  perspective: 1000px;
}

.flip-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  text-align: center;
  transition: transform 0.6s;
  transform-style: preserve-3d;
  box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
}

.flip-card:hover .flip-card-inner {
  transform: rotateY(180deg);
}

.flip-card-front, .flip-card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}

.flip-card-front {
  background-color: #bbb;
  color: black;
}

.flip-card-back {
  background-color: #404041;
  color: white;
  transform: rotateY(180deg);
}

</style>
<body>
<div class="container">
<div class="flip-card">
  <div class="flip-card-inner">
    <div class="flip-card-front">
    <img src="csm hoodie.webp" alt="CSM" style="width:100%">
    </div>
    <div class="flip-card-back">
      <h1>Chainsaw Man Title</h1> 
      <h2>$27</h2>
      <h3>Chainsaw Man</h3>
    </div>
  </div>
</div>
</div>
